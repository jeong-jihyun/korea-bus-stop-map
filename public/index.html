<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버스 정류장 찾기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 위에 검색줄, 가운데 지도, 아래(넓은 화면은 오른쪽)에 가까운 순 목록 */
  :root {
    --ink: #14213d;      /* 짙은 남색: 글자, 헤더 */
    --paper: #f6f7f4;    /* 배경 */
    --line: #d9dcd3;     /* 구분선 */
    --signal: #0b6bcb;   /* 간선버스 파랑: 주요 버튼 */
    --stop: #e8590c;     /* 정류장 표지판 주황 */
    --muted: #5b6475;
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html, body { max-width: 100%; overflow-x: hidden; }
  header, main, .notice { min-width: 0; max-width: 100%; }
  body { height: 100dvh; } /* 모바일 주소창 때문에 아래가 잘리지 않게 */
  body { font-family: var(--font); color: var(--ink); background: var(--paper); display: flex; flex-direction: column; }
  header { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  form { display: flex; gap: 8px; flex-wrap: wrap; flex: 1 1 320px; }
  input, select, button { font: inherit; border-radius: 6px; border: 1px solid transparent; padding: 9px 12px; }
  #bus { flex: 1 1 120px; min-width: 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  select { background: #fff; color: var(--ink); }
  #region { background: #fff; color: var(--ink); }
  #regionwrap { position: relative; flex: 0 1 150px; min-width: 110px; }
  #regionwrap #region { width: 100%; }
  #regionbox { position: absolute; top: calc(100% + 4px); left: 0; width: max(100%, 220px); max-height: 46vh; overflow-y: auto; background: #fff; color: var(--ink); border-radius: 8px; box-shadow: 0 6px 20px #0006; z-index: 3000; }
  #regionbox[hidden] { display: none; }
  #regionbox li { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  #regionbox li:last-child { border-bottom: 0; }
  #regionbox li.on, #regionbox li:hover { background: #eef4fb; }
  #regionbox li.none { color: var(--muted); cursor: default; }
  header { position: relative; z-index: 2000; }
  button.go { background: var(--signal); color: #fff; font-weight: 700; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: progress; }
  button.loc { background: transparent; color: #fff; border-color: #ffffff66; cursor: pointer; }
  .route { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 11px 16px; cursor: pointer; display: block; }
  .route:hover { background: #eef4fb; }
  .route .rn { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .route .city { font-size: 12px; color: #fff; background: var(--signal); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
  .route .dir { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .back { margin: 8px 16px; background: #fff; color: var(--signal); border: 1px solid var(--signal); cursor: pointer; font-weight: 700; padding: 6px 12px; }
  .seq { display: inline-block; min-width: 26px; color: var(--muted); font-variant-numeric: tabular-nums; }
  button.near { background: #ffd43b; color: var(--ink); font-weight: 700; cursor: pointer; }
  button.near:disabled { opacity: .6; cursor: progress; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
  .chip { border: 1px solid var(--signal); background: #fff; color: var(--signal); font-weight: 700; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip:hover { background: var(--signal); color: #fff; }
  .nobus { padding: 0 16px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  li.stop > button { border-bottom: 0; padding-bottom: 6px; }
  :focus-visible { outline: 3px solid #ffd43b; outline-offset: 2px; }
  .notice { padding: 8px 16px; font-size: 13px; background: #fff3bf; color: #5c4400; }
  .notice[hidden] { display: none; }
  .notice.err { background: #ffe3e3; color: #8a1c1c; }
  main { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr minmax(120px, 36%); }
  #map { min-height: 200px; }
  aside { overflow: auto; border-top: 1px solid var(--line); background: #fff; }
  aside h2 { font-size: 13px; margin: 0; padding: 10px 16px; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 11px 16px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  li button:hover, li button.on { background: #eef4fb; }
  .nm { font-weight: 500; }
  .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dist { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { padding: 16px; color: var(--muted); font-size: 14px; }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--stop); border: 2px solid #fff; box-shadow: 0 1px 4px #0006; }
  .pin.me { background: var(--signal); border-radius: 50%; transform: none; }
  .sd { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px #0007; }
  .busicon { filter: drop-shadow(0 2px 3px #0008); }
  li.legend { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; background: #fafaf7; }
  li.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  li.legend .sp { display: inline-block; width: 14px; }
  li.legend .guess { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .liverow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  #livestat { font-weight: 700; }
  #liverefresh { background: #fff; color: var(--signal); border: 1px solid var(--signal); font-weight: 700; padding: 4px 10px; cursor: pointer; }
  li.dirhead { padding: 6px 16px; font-size: 12px; font-weight: 700; background: #eef0ea; border-left: 4px solid var(--line); }
  /* 오른쪽(좁은 화면은 아래) 목록 접기/펼치기 */
  main.sb-off { grid-template-rows: 1fr 0; }
  main.sb-off aside { display: none; }
  .sbtoggle { background: #fff; color: var(--ink); border: 2px solid #0003; border-radius: 6px; padding: 6px 10px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 1px 4px #0004; }
  .sbtoggle:hover { background: #eef4fb; }
  /* 좁은 화면: 제목 줄을 없애고 검색줄을 작게 해서 지도·목록 자리를 확보 */
  @media (max-width: 859px) {
    header { padding: 8px 10px; gap: 0; }
    header h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } /* 화면에서는 숨기고 스크린리더용으로만 */
    /* 칸 크기를 화면 폭에 맞춰 나눠서(글자가 커져도) 오른쪽으로 삐져나가지 않게 */
    form { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; flex-basis: 100%; min-width: 0; width: 100%; align-items: stretch; }
    form > * { min-width: 0; width: 100%; }
    #regionwrap { grid-column: span 5; }
    #bus { grid-column: span 3; font-size: 16px; text-align: center; }
    #radius { grid-column: span 4; }
    #go { grid-column: span 3; }
    #near { grid-column: span 6; }
    #loc { grid-column: span 3; }
    input, select, button { padding: 8px 6px; font-size: 14px; line-height: 1.2; }
    button { white-space: nowrap; overflow: hidden; text-overflow: clip; }
    .notice { padding: 6px 10px; font-size: 12px; }
  }
  @media (min-width: 860px) { main.sb-off { grid-template-rows: none; grid-template-columns: 1fr 0; } }
  @media (min-width: 860px) {
    main { grid-template-rows: none; grid-template-columns: 1fr 340px; }
    aside { border-top: 0; border-left: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>버스 정류장 찾기</h1>
  <form id="f">
    <div id="regionwrap">
      <input id="region" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" value="내 주변" placeholder="지역" role="combobox" aria-expanded="false" aria-controls="regionbox" aria-label="검색 지역 (입력하면 자동완성)">
      <ul id="regionbox" role="listbox" hidden></ul>
    </div>
    <input id="bus" inputmode="numeric" autocomplete="off" placeholder="버스 번호 (예: 102)" value="102" aria-label="버스 번호">
    <select id="radius" aria-label="검색 반경">
      <option value="500">반경 500m</option>
      <option value="1000" selected>반경 1km</option>
      <option value="2000">반경 2km</option>
      <option value="3000">반경 3km</option>
    </select>
    <button class="go" id="go" type="submit">찾기</button>
    <button class="near" id="near" type="button">주변 버스 보기</button>
    <button class="loc" id="loc" type="button">내 위치</button>
  </form>
</header>
<div class="notice" id="notice" hidden></div>
<main>
  <div id="map" role="application" aria-label="지도"></div>
  <aside>
    <h2 id="title">버스 번호를 모르면 "주변 버스 보기"를 누르세요</h2>
    <ul id="list"></ul>
    <div class="empty" id="hint">지도를 클릭하면 그 지점이 검색 중심이 돼요. </div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var CITY_HALL = [36.3504, 127.3845]; // 대전시청 (실제 데이터 확인된 지역)
  var center = CITY_HALL.slice();

  var map = L.map('map').setView(center, 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var meMarker = L.marker(center, { icon: L.divIcon({ className: '', html: '<div class="pin me"></div>', iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map);
  var radiusCircle = null;
  var stopLayer = L.layerGroup().addTo(map);
  var markers = {};

  var $ = function (id) { return document.getElementById(id); };
  function notice(msg, isErr) {
    var n = $('notice');
    if (!msg) { n.hidden = true; return; }
    n.textContent = msg; n.className = 'notice' + (isErr ? ' err' : ''); n.hidden = false;
  }
  function setCenter(ll, pan) {
    center = ll; meMarker.setLatLng(ll);
    if (pan) map.setView(ll, 15);
  }

  // 지도를 클릭하면 그 자리가 검색 중심
  map.on('click', function (e) { setCenter([e.latlng.lat, e.latlng.lng], false); notice('검색 중심을 옮겼어요. 다시 "찾기"를 눌러 주세요.'); });

  function locate() {
    if (!navigator.geolocation) { notice('이 브라우저는 위치 기능을 지원하지 않아요. 지도를 클릭해 위치를 정하세요.', true); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      setCenter([p.coords.latitude, p.coords.longitude], true); notice('');
    }, function () {
      notice('위치 권한이 없어서 대전시청 기준으로 보여드려요. 지도를 클릭해 위치를 바꿀 수 있어요.', true);
    }, { enableHighAccuracy: true, timeout: 8000 });
  }
  $('loc').addEventListener('click', locate);

  function render(data, radius) {
    sbShow();
    stopLayer.clearLayers(); markers = {}; $('list').innerHTML = ''; if (typeof stopLive === 'function') stopLive();
    if (radiusCircle) map.removeLayer(radiusCircle);
    radiusCircle = L.circle(center, { radius: radius, color: '#0b6bcb', weight: 1, fillOpacity: 0.05 }).addTo(map);

    var stops = data.stops || [];
    $('title').textContent = stops.length ? ('가까운 정류장 ' + stops.length + '곳 (가까운 순)') : '결과 없음';
    $('hint').hidden = stops.length > 0;
    if (!stops.length) { $('hint').textContent = '이 반경 안에는 해당 버스가 서는 정류장이 없어요. 반경을 넓혀 보세요.'; }

    var bounds = L.latLngBounds([center]);
    stops.forEach(function (s) {
      var m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [26, 26], iconAnchor: [13, 26] }) })
        .bindPopup('<b>' + esc(s.name) + '</b><br>' + (s.no ? '정류장 번호 ' + esc(s.no) + '<br>' : '') + s.distance + 'm')
        .addTo(stopLayer);
      markers[s.nodeId] = m; bounds.extend([s.lat, s.lng]);

      var li = document.createElement('li');
      var b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span><span class="nm">' + esc(s.name) + '</span><br><span class="sub">' + (s.no ? '번호 ' + esc(s.no) : '번호 없음') + '</span></span><span class="dist">' + fmt(s.distance) + '</span>';
      b.addEventListener('click', function () {
        map.setView([s.lat, s.lng], 17); m.openPopup();
        Array.prototype.forEach.call(document.querySelectorAll('li button.on'), function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
      li.appendChild(b); $('list').appendChild(li);
      m.on('click', function () { b.scrollIntoView({ block: 'nearest' }); });
    });
    if (stops.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
    else map.setView(center, 15);
  }
  function renderNearby(data, radius) {
    sbShow();
    stopLayer.clearLayers(); markers = {}; $('list').innerHTML = ''; if (typeof stopLive === 'function') stopLive();
    if (radiusCircle) map.removeLayer(radiusCircle);
    radiusCircle = L.circle(center, { radius: radius, color: '#0b6bcb', weight: 1, fillOpacity: 0.05 }).addTo(map);
    var stops = data.stops || [];
    $('title').textContent = '주변 정류장 ' + stops.length + '곳 · 버스 번호를 누르면 그 버스가 서는 정류장을 보여줘요';
    $('hint').hidden = true;
    var bounds = L.latLngBounds([center]);
    stops.forEach(function (s) {
      var m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [26, 26], iconAnchor: [13, 26] }) })
        .bindPopup('<b>' + esc(s.name) + '</b><br>' + (s.no ? '정류장 번호 ' + esc(s.no) + '<br>' : '') + s.distance + 'm')
        .addTo(stopLayer);
      bounds.extend([s.lat, s.lng]);
      var li = document.createElement('li'); li.className = 'stop';
      var b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span><span class="nm">' + esc(s.name) + '</span><br><span class="sub">' + (s.no ? '번호 ' + esc(s.no) : '번호 없음') + '</span></span><span class="dist">' + fmt(s.distance) + '</span>';
      b.addEventListener('click', function () { map.setView([s.lat, s.lng], 17); m.openPopup(); });
      li.appendChild(b);
      if (s.routes && s.routes.length) {
        var row = document.createElement('div'); row.className = 'chips';
        s.routes.forEach(function (r) {
          var c = document.createElement('button'); c.type = 'button'; c.className = 'chip';
          c.textContent = r.routeNo; c.title = (r.type || '') + (r.from ? ' ' + r.from + ' → ' + r.to : '');
          c.addEventListener('click', function () {
            $('bus').value = r.routeNo; setRegion('near');
            $('f').dispatchEvent(new Event('submit', { cancelable: true }));
          });
          row.appendChild(c);
        });
        li.appendChild(row);
      } else {
        var nb = document.createElement('div'); nb.className = 'nobus'; nb.textContent = '서는 버스 정보를 가져오지 못했어요'; li.appendChild(nb);
      }
      $('list').appendChild(li);
    });
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
  }

  $('near').addEventListener('click', function () {
    var radius = parseInt($('radius').value, 10);
    $('near').disabled = true; $('near').textContent = '찾는 중…'; notice('');
    fetch('/api/nearby?lat=' + center[0] + '&lng=' + center[1] + '&radius=' + radius)
      .then(function (r) { return r.json(); }).then(function (data) {
        if (data.error) { notice(data.error, true); return; }
        if (data.demo) notice('샘플 데이터예요. 서버에 공공데이터 인증키(TAGO_API_KEY)를 설정하면 실제 정류장이 나와요.');
        else if (data.routesError) notice('정류장은 찾았지만 서는 버스 번호를 가져오지 못했어요. (' + data.routesError + ')', true);
        renderNearby(data, radius);
      }).catch(function () {
        notice('서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.', true);
      }).then(function () { $('near').disabled = false; $('near').textContent = '주변 버스 보기'; });
  });

  // ---- 지역 선택 / 전국 검색 ----
  // 지역 칸: 글자를 입력하면 자동완성 (내 주변 / 전국 전체 / 도시 목록)
  var REGIONS = [{ code: 'near', name: '내 주변' }, { code: 'all', name: '전국 전체' }];
  var regionBox = $('regionbox'), regionIn = $('region'), regionPrev = '내 주변', hi = -1, shown = [];
  function norm(t) { return String(t || '').replace(/\s+/g, ''); }
  function showRegionList(filter) {
    var t = norm(filter);
    shown = REGIONS.filter(function (x) { return !t || norm(x.name).indexOf(t) >= 0; });
    // 앞부분이 같은 이름을 위로
    shown.sort(function (a, b) { return (norm(a.name).indexOf(t) === 0 ? 0 : 1) - (norm(b.name).indexOf(t) === 0 ? 0 : 1); });
    regionBox.innerHTML = ''; hi = shown.length && t ? 0 : -1;
    shown.forEach(function (c, k) {
      var li = document.createElement('li'); li.textContent = c.name; li.setAttribute('role', 'option');
      if (k === hi) li.className = 'on';
      li.addEventListener('mousedown', function (e) { e.preventDefault(); }); // 입력칸이 먼저 닫히지 않게
      li.addEventListener('click', function () { pickRegion(c); regionIn.blur(); });
      regionBox.appendChild(li);
    });
    if (!shown.length) { var n = document.createElement('li'); n.className = 'none'; n.textContent = '맞는 지역이 없어요'; regionBox.appendChild(n); }
    regionBox.hidden = false; regionIn.setAttribute('aria-expanded', 'true');
  }
  function hideRegionList() { regionBox.hidden = true; regionIn.setAttribute('aria-expanded', 'false'); hi = -1; }
  function markHi() { Array.prototype.forEach.call(regionBox.children, function (li, k) { li.classList.toggle('on', k === hi); if (k === hi) li.scrollIntoView({ block: 'nearest' }); }); }
  function pickRegion(c) { regionIn.value = c.name; regionPrev = c.name; hideRegionList(); }
  fetch('/api/cities').then(function (r) { return r.json(); }).then(function (d) {
    REGIONS = REGIONS.concat((d.cities || []).map(function (c) { return { code: c.code, name: c.name }; }));
    if (!regionBox.hidden) showRegionList(regionIn.value === regionPrev ? '' : regionIn.value);
  }).catch(function () { /* 지역 목록 없이도 '내 주변'·'전국 전체'는 동작 */ });
  // 칸을 누르면 현재 값이 전체 선택되고 목록이 펼쳐져요. 바로 타이핑하면 글자가 바뀌며 목록이 좁혀져요.
  regionIn.addEventListener('focus', function () { regionPrev = regionIn.value || regionPrev; regionIn.placeholder = regionPrev; regionIn.value = ''; showRegionList(''); });
  regionIn.addEventListener('input', function () { showRegionList(regionIn.value); });
  regionIn.addEventListener('blur', function () { hideRegionList(); if (!regionIn.value.trim()) regionIn.value = regionPrev; regionIn.placeholder = '지역'; });
  var lastEnter = 0;
  function regionEnter() {
    lastEnter = Date.now();
    var t = norm(regionIn.value);
    if (!t) { regionIn.value = regionPrev; hideRegionList(); }
    else if (!regionBox.hidden && shown.length) pickRegion(shown[hi >= 0 ? hi : 0]);
    else hideRegionList();
    regionIn.blur();
    $('f').dispatchEvent(new Event('submit', { cancelable: true }));
  }
  regionIn.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (regionBox.hidden) showRegionList(regionIn.value);
      if (!shown.length) return; hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length; markHi();
    } else if (e.key === 'Escape') { hideRegionList(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      // 한글을 치는 중에는 엔터가 '글자 확정'으로만 쓰여 여기로 안 올 수 있어요 → 아래 keyup 에서 처리
      if (!e.isComposing && e.keyCode !== 229) regionEnter();
    }
  });
  regionIn.addEventListener('keyup', function (e) {
    if (e.key === 'Enter' && Date.now() - lastEnter > 600) regionEnter();
  });
  function setRegion(code) { var r = REGIONS.filter(function (x) { return x.code === code; })[0]; regionIn.value = r ? r.name : '내 주변'; regionPrev = regionIn.value; }
  // 입력한 글자를 지역으로 해석: 정확히 같음 → 한 곳만 겹침 → 여러 곳이면 안내
  function getRegion() {
    var t = $('region').value.trim().replace(/\s+/g, '');
    if (!t) return REGIONS[0];
    var exact = REGIONS.filter(function (x) { return x.name.replace(/\s+/g, '') === t; })[0];
    if (exact) return exact;
    var part = REGIONS.filter(function (x) { return x.name.replace(/\s+/g, '').indexOf(t) >= 0; });
    if (part.length === 1) { $('region').value = part[0].name; return part[0]; }
    if (part.length > 1) {
      // '서울'처럼 앞부분이 같은 이름이 하나뿐이면 그걸 사용
      var starts = part.filter(function (x) { return x.name.replace(/\s+/g, '').indexOf(t) === 0; });
      if (starts.length === 1) { $('region').value = starts[0].name; return starts[0]; }
      return { ambiguous: part.slice(0, 6).map(function (x) { return x.name; }) };
    }
    return null;
  }

  var lastRoutes = null;
  function clearMap() {
    stopLayer.clearLayers(); markers = {}; $('list').innerHTML = ''; if (typeof stopLive === 'function') stopLive();
    if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
  }
  function searchRoutes(bus) {
    var rg = getRegion(); var city = rg.code; var cityName = rg.name;
    $('go').disabled = true; $('go').textContent = '찾는 중…'; notice('');
    fetch('/api/routes?bus=' + encodeURIComponent(bus) + '&city=' + encodeURIComponent(city) + '&cityName=' + encodeURIComponent(cityName))
      .then(function (r) { return r.json(); }).then(function (data) {
        if (data.error) { notice(data.error, true); return; }
        if (data.demo) notice('샘플 데이터예요. 서버에 공공데이터 인증키(TAGO_API_KEY)를 설정하면 실제 노선이 나와요.');
        else if (data.failed) notice('일부 지역(' + data.failed + '곳)은 조회하지 못했어요. 결과가 빠졌을 수 있어요.', true);
        lastRoutes = { bus: bus, data: data };
        renderRoutes(bus, data);
        if (data.routes.length === 1) showRoute(data.routes[0], false);
      }).catch(function () {
        notice('서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.', true);
      }).then(function () { $('go').disabled = false; $('go').textContent = '찾기'; });
  }
  function renderRoutes(bus, data) {
    sbShow();
    clearMap();
    var routes = data.routes || [];
    $('title').textContent = routes.length ? (bus + '번 노선 ' + routes.length + '개 (' + data.searched + '개 지역 검색) · 눌러서 전체 정류장 보기') : '결과 없음';
    $('hint').hidden = routes.length > 0;
    if (!routes.length) $('hint').textContent = bus + '번 버스를 찾지 못했어요. 지역을 바꾸거나 "전국 전체"로 찾아 보세요.';
    routes.forEach(function (r) {
      var li = document.createElement('li');
      var b = document.createElement('button'); b.type = 'button'; b.className = 'route';
      b.innerHTML = '<span class="rn">' + esc(r.routeNo) + '</span><span class="city">' + esc(r.cityName || r.cityCode) + '</span>' + esc(r.type || '') +
        '<span class="dir">' + esc(r.from || '') + ' → ' + esc(r.to || '') + '</span>';
      b.addEventListener('click', function () { showRoute(r, true); });
      li.appendChild(b); $('list').appendChild(li);
    });
  }
  // ---- 노선 보기: 방향별 색, 실시간 버스 위치 ----
  var DIRC = ['#0b6bcb', '#d6336c']; // 0 정방향(파랑), 1 반대 방향(빨강)
  var busLayer = L.layerGroup().addTo(map);
  var live = null; // { r, stops, timer }
  function stopLive() { if (live && live.timer) clearInterval(live.timer); live = null; busLayer.clearLayers(); }
  function busIcon(color) {
    var svg = '<svg viewBox="0 0 24 24" width="32" height="32"><rect x="3" y="2.5" width="18" height="16" rx="3.5" fill="' + color + '" stroke="#fff" stroke-width="1.6"/>' +
      '<rect x="5.5" y="5" width="13" height="6.5" rx="1.2" fill="#fff"/><circle cx="8" cy="15" r="1.5" fill="#fff"/><circle cx="16" cy="15" r="1.5" fill="#fff"/>' +
      '<rect x="5" y="18.5" width="3.4" height="3" rx="1" fill="#222"/><rect x="15.6" y="18.5" width="3.4" height="3" rx="1" fill="#222"/></svg>';
    return L.divIcon({ className: 'busicon', html: svg, iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -14] });
  }
  function loadBuses(manual) {
    if (!live) return;
    var cur = live, r = cur.r;
    var st = $('livestat'); if (manual && st) st.textContent = '버스 위치 불러오는 중…';
    fetch('/api/buses?city=' + encodeURIComponent(r.cityCode) + '&routeId=' + encodeURIComponent(r.routeId))
      .then(function (x) { return x.json(); }).then(function (data) {
        if (live !== cur) return; // 그 사이 다른 노선으로 바뀜
        busLayer.clearLayers();
        var st2 = $('livestat'); if (!st2) return;
        if (data.error) { st2.textContent = '실시간 버스 위치를 불러오지 못했어요. ' + (/활용신청|인증/.test(data.error) ? '(버스 위치 서비스 활용신청이 필요해요)' : ''); st2.title = data.error; return; }
        var list = data.buses || [];
        list.forEach(function (b) {
          var near = cur.stops.filter(function (s) { return (b.nodeId && s.nodeId === b.nodeId) || (b.order && s.order === b.order); })[0];
          var dir = near ? near.dir : 0;
          var nm = b.nodeName || (near && near.name) || '';
          var pos = (b.lat != null && b.lng != null) ? [b.lat, b.lng] : (near ? [near.lat, near.lng] : null);
          if (!pos) return;
          L.marker(pos, { icon: busIcon(DIRC[dir]), zIndexOffset: 1000 })
            .bindPopup('<b>🚌 ' + esc(r.routeNo) + '번</b>' + (b.plate ? ' · ' + esc(b.plate) : '') + (nm ? '<br>' + (b.atStop ? esc(nm) + ' 정차 중' : esc(nm) + ' 지나는 중') : '') +
              '<br>' + (dir ? '반대 방향' : '정방향') + (b.lowFloor ? ' · 저상' : '') + (b.full ? ' · 혼잡' : '')).addTo(busLayer);
        });
        var t = new Date();
        st2.textContent = list.length ? ('지금 달리는 버스 ' + list.length + '대 · ' + t.toLocaleTimeString('ko-KR') + ' 기준') : '지금 운행 중인 버스가 없어요 (' + t.toLocaleTimeString('ko-KR') + ')';
        st2.title = '';
      }).catch(function () { var s3 = $('livestat'); if (s3) s3.textContent = '실시간 버스 위치를 불러오지 못했어요.'; });
  }
  function showRoute(r, canGoBack) {
    notice('');
    fetch('/api/route-stops?v=2&city=' + encodeURIComponent(r.cityCode) + '&routeId=' + encodeURIComponent(r.routeId))
      .then(function (x) { return x.json(); }).then(function (data) {
        if (data.error) { notice(data.error, true); return; }
        clearMap();
        var stops = data.stops || [];
        $('title').textContent = r.routeNo + '번 · ' + (r.cityName || '') + ' · ' + (r.from || '') + ' → ' + (r.to || '') + ' · 정류장 ' + stops.length + '곳';
        $('hint').hidden = true;
        if (canGoBack && lastRoutes) {
          var li0 = document.createElement('li'); var bk = document.createElement('button'); bk.type = 'button'; bk.className = 'back'; bk.textContent = '← 노선 목록으로';
          bk.addEventListener('click', function () { renderRoutes(lastRoutes.bus, lastRoutes.data); }); li0.appendChild(bk); $('list').appendChild(li0);
        }
        // 방향 안내 + 실시간 버스 상태줄
        var lastOf = [null, null];
        stops.forEach(function (s) { lastOf[s.dir ? 1 : 0] = s; });
        var hasTwo = !!lastOf[1];
        var lg = document.createElement('li'); lg.className = 'legend';
        lg.innerHTML = '<div><i style="background:' + DIRC[0] + '"></i>' + (hasTwo ? esc(lastOf[0].name) + ' 방면' : '정방향') + (hasTwo ? '<span class="sp"></span><i style="background:' + DIRC[1] + '"></i>' + esc(lastOf[1].name) + ' 방면 (반대 방향)' : '') + (data.dirGuess ? '<div class="guess">방향은 정류장 순서로 나눈 추정이에요. 실제와 조금 다를 수 있어요.</div>' : '') + '</div>' +
          '<div class="liverow"><span id="livestat">버스 위치 불러오는 중…</span><button type="button" id="liverefresh">새로고침</button></div>';
        $('list').appendChild(lg);
        $('liverefresh').addEventListener('click', function () { loadBuses(true); });

        var pts = [], seg = [], segDir = 0, prevDir = null;
        function flush() { if (seg.length > 1) L.polyline(seg, { color: DIRC[segDir], weight: 4, opacity: 0.75 }).addTo(stopLayer); }
        stops.forEach(function (s, i) {
          var d = s.dir ? 1 : 0;
          pts.push([s.lat, s.lng]);
          if (prevDir !== null && d !== prevDir) { flush(); seg = []; }
          seg.push([s.lat, s.lng]); segDir = d; prevDir = d;
          if (hasTwo && (i === 0 || stops[i - 1].dir !== s.dir)) {
            var h = document.createElement('li'); h.className = 'dirhead'; h.style.borderLeftColor = DIRC[d];
            h.textContent = (d ? '반대 방향' : '정방향') + ' · ' + (lastOf[d] ? lastOf[d].name + ' 방면' : ''); $('list').appendChild(h);
          }
          var m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="sd" style="background:' + DIRC[d] + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) })
            .bindPopup('<b>' + esc(s.name) + '</b><br>' + (s.no ? '정류장 번호 ' + esc(s.no) + '<br>' : '') + (i + 1) + '번째 정류장' + (hasTwo ? ' · ' + (d ? '반대 방향' : '정방향') : '')).addTo(stopLayer);
          var li = document.createElement('li'); var b = document.createElement('button'); b.type = 'button'; b.style.borderLeft = '4px solid ' + DIRC[d];
          b.innerHTML = '<span><span class="seq">' + (i + 1) + '</span><span class="nm">' + esc(s.name) + '</span></span><span class="sub">' + (s.no ? '번호 ' + esc(s.no) : '') + '</span>';
          b.addEventListener('click', function () { map.setView([s.lat, s.lng], 17); m.openPopup(); });
          li.appendChild(b); $('list').appendChild(li);
        });
        flush();
        if (pts.length) map.fitBounds(pts, { padding: [30, 30] });
        live = { r: r, stops: stops, timer: setInterval(function () { if (!document.hidden) loadBuses(false); }, 30000) };
        loadBuses(false);
      }).catch(function () { notice('정류장을 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.', true); });
  }


  // ---- 목록(오른쪽 사이드바) 접기/펼치기 ----
  var mainEl = document.querySelector('main');
  var sbBtn = null, sbOff = false;
  try { sbOff = localStorage.getItem('sbOff') === '1'; } catch (e) {}
  function sbCount() { return document.querySelectorAll('#list li').length; }
  function sbRender() {
    mainEl.classList.toggle('sb-off', sbOff);
    if (!sbBtn) return;
    var n = sbCount();
    sbBtn.textContent = sbOff ? ('목록 펼치기' + (n ? ' (' + n + ')' : '')) : '목록 접기';
    sbBtn.setAttribute('aria-expanded', sbOff ? 'false' : 'true');
    sbBtn.title = sbOff ? '정류장·노선 목록을 다시 보여요' : '목록을 접어 지도를 넓게 봐요';
    setTimeout(function () { map.invalidateSize(); }, 50);
  }
  // 검색 결과(목록)가 나오면 접혀 있어도 자동으로 펼침 — 안 펼치면 '반응이 없는 것'처럼 보여서
  function sbShow() { if (sbOff) { sbOff = false; try { localStorage.setItem('sbOff', '0'); } catch (e) {} sbRender(); } }
  var SbCtl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      sbBtn = L.DomUtil.create('button', 'sbtoggle'); sbBtn.type = 'button';
      L.DomEvent.disableClickPropagation(sbBtn);
      L.DomEvent.on(sbBtn, 'click', function () {
        sbOff = !sbOff;
        try { localStorage.setItem('sbOff', sbOff ? '1' : '0'); } catch (e) {}
        sbRender();
      });
      return sbBtn;
    }
  });
  new SbCtl().addTo(map);
  sbRender();
  new MutationObserver(function () { if (sbOff) sbRender(); }).observe($('list'), { childList: true });

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : m + 'm'; }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var bus = $('bus').value.trim();
    if (!bus) { notice('버스 번호를 입력하세요.', true); return; }
    var rg = getRegion();
    if (!rg) { notice('"' + $('region').value + '" 지역을 찾지 못했어요. 목록에 나오는 이름(예: 서울특별시, 성남시)으로 입력해 주세요.', true); return; }
    if (rg.ambiguous) { notice('여러 지역이 겹쳐요: ' + rg.ambiguous.join(', ') + ' — 목록에서 골라 주세요.', true); return; }
    if (rg.code !== 'near') { searchRoutes(bus); return; }
    var radius = parseInt($('radius').value, 10);
    $('go').disabled = true; $('go').textContent = '찾는 중…'; notice('');
    var q = 'bus=' + encodeURIComponent(bus) + '&lat=' + center[0] + '&lng=' + center[1] + '&radius=' + radius;
    fetch('/api/search?' + q).then(function (r) { return r.json(); }).then(function (data) {
      if (data.error) { notice(data.error, true); return; }
      if (data.demo) notice('샘플 데이터예요. 서버에 공공데이터 인증키(TAGO_API_KEY)를 설정하면 실제 정류장이 나와요.');
      render(data, radius);
    }).catch(function () {
      notice('서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.', true);
    }).then(function () { $('go').disabled = false; $('go').textContent = '찾기'; });
  });

  locate();
})();
</script>
</body>
</html>
